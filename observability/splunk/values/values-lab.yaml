###############################################################################
# Splunk OpenTelemetry Collector - EKS Observability Lab
#
# Purpose:
#   Override file for the upstream Splunk OpenTelemetry Collector Helm chart.
#   Only settings intentionally changed for this EKS observability lab are
#   included here.
#
# Upstream chart:
#   vendor/splunk-otel-collector/values.yaml
#
# Chart version:
#   0.156.0
#
# Important:
# - Any setting not present here intentionally uses the upstream default.
# - Keep this file limited to settings we intentionally override.
# - Do not copy the entire upstream values.yaml into this file.
# - Do not store secrets or tokens in this file.
# - Provide sensitive values through Kubernetes Secrets.
# - Review overrides whenever upgrading the Helm chart version.
###############################################################################

###############################################################################
# Section 1: Kubernetes Platform and Environment
###############################################################################
#
# The Kubernetes cluster name.
#
# Although the Collector can automatically discover the cluster name on many
# Amazon EKS deployments, explicitly setting it avoids dependencies on AWS
# instance metadata or IAM permissions during startup and provides consistent
# behavior across environments.
#
clusterName: <eks-cluster-name>
#
# The Kubernetes cluster is hosted in Amazon Web Services.
#
# Setting the cloud provider to AWS enables AWS-specific Collector behavior,
# cloud resource detection, and Amazon EKS integrations.
#
cloudProvider: aws
#
# This is a standard Amazon EKS cluster.
#
# Setting the distribution to "eks" enables EKS-specific Collector behavior.
#
distribution: eks
#
# Adds an environment attribute to all metrics, traces, and logs.
#
# This represents the deployment environment (development, test, staging,
# production) and is independent of the Kubernetes cluster name.
#
environment: development
###############################################################################
# Section 2: Splunk Observability Cloud Destination and Credentials
###############################################################################
#
# Setting the realm enables Splunk Observability Cloud as a destination for
# supported telemetry and allows the chart to construct the standard ingest and
# API endpoints for this realm.
splunkObservability:
  realm: us1
#
# Only the realm is required because this deployment uses the standard Splunk
# Observability Cloud endpoints.
#
# The Splunk Observability access token is intentionally not stored in this
# values file. It will be provided through a separately managed Kubernetes
# Secret so that credentials are not committed to Git.
#
# ingestUrl and apiUrl are intentionally omitted because the chart constructs
# the standard endpoints automatically from the realm.
#
# metricsEnabled and tracesEnabled are intentionally omitted because their
# upstream defaults are already true.
#
# infrastructureMonitoringEventsEnabled, profilingEnabled, and
# secureAppEnabled remain at their default value of false.
#
# Use an existing Kubernetes Secret rather than allowing Helm to create one.
#
# The Secret must already exist in the same namespace where the chart is installed
# and must contain the key:
#
#   splunk_observability_access_token
#   splunk_platform_hec_token
#
# This shared Secret is also used later by the Splunk Platform configuration
# to store the HEC token.
#
# Secret validation remains enabled so Helm verifies that the required Secret
# exists before completing an installation or upgrade.
#
# The actual token is never stored in this values file or committed to Git.
secret:
  create: false
  name: splunk-otel-secret
  validateSecret: true
#
# Secret named: splunk-otel-secret
#
###############################################################################

###############################################################################
# Section 3: Cluster Receiver and Prometheus Autodiscovery
###############################################################################
#
# We intentionally retain the upstream Cluster Receiver configuration.
#
# The Cluster Receiver is deployed as a single replica and collects
# cluster-wide Kubernetes telemetry including metrics, metadata, objects,
# events, and Kubernetes API server metrics.
#
# Reasons for retaining the upstream defaults:
#
# - The default single replica is sufficient for this lab.
# - The default CPU and memory limits provide an appropriate starting point.
# - Default scheduling (nodeSelector, tolerations, and affinity) is suitable
#   for the single managed node group.
# - Host networking is not required for this Amazon EKS deployment.
# - The chart's default resource detection configuration is retained. AWS
#   resource enrichment is enabled through Amazon EKS Pod Identity, which is
#   provisioned by Terraform before the Collector is installed.
#
# Telemetry flow:
#
# - Cluster metrics and Kubernetes metadata are exported to Splunk
#   Observability Cloud.
# - Kubernetes API server metrics are collected by the Cluster Receiver and
#   exported to Splunk Observability Cloud.
# - Kubernetes objects (Pods, NetworkPolicies, and
#   CustomResourceDefinitions) are exported to Splunk Cloud Platform.
# - Kubernetes events are exported to Splunk Cloud Platform.
# - The Agent DaemonSet collects node metrics, kubelet metrics, host metrics,
#   and container logs.
# - Log Observer Connect correlates indexed logs with infrastructure metrics
#   and traces.
#
###############################################################################
#
# Cluster Receiver
# │
# ├── Kubernetes metrics
# │        → Splunk Observability
# │
# ├── Kubernetes metadata
# │        → Splunk Observability
# │
# ├── Kubernetes objects
# │        → Splunk Cloud Platform
# │
# ├── Kubernetes events
# │        → Splunk Cloud Platform
# │
# └── EKS API Server metrics
#          → Splunk Observability
#
###############################################################################
# Section 3.1: Prometheus Metric Autodiscovery
###############################################################################
#
# Enable Prometheus autodiscovery so the Agent can scrape metrics from
# Kubernetes pods that use standard Prometheus scrape annotations.
#
# This is useful for lab workloads such as KubeInvaders and other applications
# that expose Prometheus-compatible metrics.
#
# Autodiscovery does not scrape every metrics endpoint automatically. Each
# workload must expose a reachable Prometheus endpoint and include supported
# annotations such as:
#
#   prometheus.io/scrape: "true"
#   prometheus.io/port: "8080"
#   prometheus.io/path: "/metrics"
#
# The scraped Prometheus metrics are converted to OpenTelemetry metrics and
# exported to Splunk Observability Cloud through the Agent.
#
# Istio autodetection remains disabled because this lab does not deploy an
# Istio service mesh.
#
autodetect:
  prometheus: true
###############################################################################

###############################################################################
# Section 4: Splunk Cloud Platform Log Ingestion
###############################################################################

# Send container logs, Kubernetes events, and supported Kubernetes object
# snapshots to Splunk Cloud Platform through the HTTP Event Collector (HEC)
# event endpoint.
#
# Log Observer Connect makes indexed container logs and Kubernetes events
# available within Splunk Observability Cloud for correlation with metrics
# and traces.
#
splunkPlatform:
  endpoint: "https://http-inputs-<splunk-stack>.splunkcloud.com/services/collector/event"
  index: "<splunk-index>"
#
# The endpoint must be the Splunk Cloud Platform HEC Event endpoint
# (services/collector/event), not the raw HEC endpoint or metrics endpoint.
#
# Store all Kubernetes logs and events in the dedicated observability index
# created for this lab.
#
# The Splunk HEC token is intentionally not stored in this values file.
# It will be read from the existing Kubernetes Secret named:
#
#   splunk-otel-secret
#
# logsEnabled is intentionally omitted because its upstream default is true.
# metricsEnabled and tracesEnabled remain false because metrics and traces are
# sent directly to Splunk Observability Cloud.
#
# TLS certificate verification remains enabled through the upstream default:
#
#   insecureSkipVerify: false
###############################################################################
#
# Telemetry routing:
#
#   Metrics  ─────────────► Splunk Observability Cloud
#   Traces   ─────────────► Splunk Observability Cloud
#   Logs     ─────────────► Splunk Cloud Platform
#   K8s Events ───────────► Splunk Cloud Platform
#   K8s Objects ──────────► Splunk Cloud Platform
#
# Log Observer Connect then exposes the indexed logs and events inside Splunk
# Observability Cloud for unified troubleshooting.
#
###############################################################################
# Section 5: Additional Kubernetes Attributes
###############################################################################
#
# We intentionally retain the upstream extraAttributes configuration.
#
# By default, the chart copies the Kubernetes "app" pod label and adds it to
# OpenTelemetry resource attributes.
#
# These resource attributes are associated with metrics, traces, and logs in
# Splunk Observability Cloud, improving workload correlation during analysis.
#
# Additional labels or annotations can be added later when a concrete
# correlation requirement exists. Automatically collecting large numbers of 
# labels is intentionally avoided because it increases telemetry cardinality, 
# storage requirements, and query complexity while often providing little 
# operational value.
#
# The default "app" label is sufficient for correlating workloads such as
# Astronomy Shop, KubeInvaders, and future demo applications in this lab.
#
# No extraAttributes override is required at this time.
###############################################################################

###############################################################################
# Section 6: Agent Collector
###############################################################################
#
# We intentionally do not override the upstream agent configuration.
#
# The Agent runs as a Kubernetes DaemonSet, deploying one OpenTelemetry
# Collector pod on every eligible EKS worker node.
# It collects node-local telemetry including container logs, host and kubelet 
# metrics, and application metrics and traces received through supported protocols 
# such as OTLP, Zipkin, and Jaeger.
#
# Telemetry flow:
# - The Agent collects host, node, container, and kubelet metrics and exports
#   them directly to Splunk Observability Cloud.
# - Applications exports metrics and traces to the Agent using supported receivers
#   such as OTLP. The Agent exports that telemetry directly
#   to Splunk Observability Cloud.
# - The Agent also collects container logs from each Kubernetes worker node and
#   exports them to Splunk Cloud Platform through the splunkPlatform logs
#   pipeline.
# - Log Observer Connect makes the indexed container logs available within
#   Splunk Observability Cloud for correlation with infrastructure metrics,
#   Kubernetes telemetry, and application traces.
#
# Reasons for retaining the upstream defaults:
# - The agent is enabled by default.
# - OTLP/gRPC and OTLP/HTTP receivers are available on ports 4317 and 4318.
# - The internal ClusterIP service provides a stable endpoint for applications.
# - hostNetwork remains enabled by the upstream chart to provide access to
#   node-local services and Kubernetes components where required.
# - Root execution allows the agent to read container and host log files.
# - RollingUpdate with maxUnavailable=1 is appropriate for this lab.
# - The default 200m CPU and 500Mi memory limits are sufficient as an initial
#   baseline and will be adjusted only if observed utilization requires it.
# - Discovery mode remains disabled until it is tested as a separate exercise.
#
# In standard EKS, AWS manages the Kubernetes API server, scheduler, controller
# manager, and etcd control plane. The chart already disables etcd metric
# collection by default.
# Scheduler and controller-manager receivers remain enabled by default but may
# not produce telemetry because AWS does not expose those control-plane
# endpoints to customer-managed worker nodes.
#
# CoreDNS and kube-proxy metrics remain relevant because those components run
# within or are reachable from the customer-managed portion of the cluster.
# Collector logs should be reviewed after deployment before disabling any
# receiver that consistently produces scrape failures.
#
# Since the upstream defaults match the initial lab design, no agent overrides
# are required at this time.
#
# The Agent complements the Cluster Receiver by collecting node-local
# telemetry, while the Cluster Receiver is responsible for cluster-wide
# telemetry obtained from the Kubernetes API.
#
###############################################################################

###############################################################################
# Section 7: Log Collection
###############################################################################
#
# We intentionally retain the upstream log collection configuration.
#
# Container logs:
# - Native OpenTelemetry filelog collection is enabled by default.
# - The container runtime is automatically detected. EKS worker nodes normally
#   use containerd, so no runtime override is required.
# - The Agent tails Kubernetes container logs from each eligible worker node.
# - The Agent's own Collector logs are excluded by default to avoid unnecessary
#   self-ingestion and recursive log volume.
# - Container logs are exported to Splunk Cloud Platform through the
#   splunkPlatform logs pipeline.
# - Log Observer Connect makes those indexed logs available in Splunk
#   Observability Cloud for correlation with metrics and traces.
#
# Optional capabilities retained for future use:
# - excludePaths can suppress noisy namespaces, pods, or containers.
# - multilineConfigs can reconstruct stack traces and other multiline messages.
# - useSplunkIncludeAnnotation can change collection from all containers to an
#   explicit opt-in model using the splunk.com/include annotation.
# - extraOperators can add custom filelog parsing and transformation.
# - extraFileLogs can collect additional files mounted from worker nodes.
#
# Journald:
# - Journald collection remains disabled because the initial lab focuses on
#   Kubernetes container stdout and stderr logs.
# - It can later collect services such as kubelet and containerd when node-level
#   system-log troubleshooting is added to the lab.
#
# Since the upstream defaults match the initial logging requirements, no
# logsCollection overrides are required at this time.
###############################################################################

###############################################################################
# Section 8: Kubernetes Metadata Enrichment
###############################################################################
#
# Copy selected Kubernetes labels into telemetry.
#
# These labels are added as OpenTelemetry resource attributes on metrics,
# logs, and traces, making it easier to filter, group, and troubleshoot
# workloads in Splunk Observability Cloud.
#
# app
#   Identifies the application or workload.
#
# component
#   Distinguishes components within an application (for example, agent,
#   cluster receiver, frontend, backend, or database).
#
# release
#   Identifies the Helm release that deployed the workload.
#
extraAttributes:
  fromLabels:
    - key: app
    - key: component
    - key: release
###############################################################################
# OpenTelemetry Astronomy Shop
###############################################################################
#
# The Astronomy Shop Collector processes application telemetry generated by
# the demo services.
#
# It runs as a single Deployment because the Splunk OpenTelemetry Collector
# already handles node-level and cluster-level Kubernetes infrastructure
# collection.
#
###############################################################################

default:
  envOverrides:
    - name: OTEL_RESOURCE_ATTRIBUTES_EXTRA
      value: deployment.environment=lab

opentelemetry-collector:
  mode: deployment

  replicaCount: 1

  presets:
    hostMetrics:
      enabled: false

    kubernetesAttributes:
      enabled: true

    kubeletMetrics:
      enabled: false

    clusterMetrics:
      enabled: false

    annotationDiscovery:
      metrics:
        enabled: false

  config:
    exporters:
      otlp/splunk:
        endpoint: splunk-otel-collector-agent.splunk.svc.cluster.local:4317
        tls:
          insecure: true

    service:
      pipelines:
        logs:
          exporters:
            - opensearch
            - debug
            - otlp/splunk

        metrics:
          exporters:
            - otlphttp/prometheus
            - debug
            - otlp/splunk

        traces:
          exporters:
            - otlp/jaeger
            - debug
            - spanmetrics
            - otlp/splunk
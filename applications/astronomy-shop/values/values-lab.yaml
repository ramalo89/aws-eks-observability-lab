###############################################################################
# OpenTelemetry Astronomy Shop
###############################################################################
#
# Purpose
# -------
# This values file customizes only the settings required for the
# OpenTelemetry Astronomy Shop demo application.
#
# The Splunk OpenTelemetry Collector deployed in the "splunk" namespace
# already performs cluster-wide Kubernetes infrastructure collection.
#
# This collector is dedicated to application telemetry generated by the
# Astronomy Shop services and simply forwards that telemetry to the central
# Splunk OpenTelemetry Collector.
#
# Best Practice
# -------------
# Override only the settings required by the lab.
#
# Everything else intentionally remains at the upstream Helm chart defaults,
# making upgrades easier while reducing configuration drift.
#
###############################################################################

###############################################################################
# Section 1: Collector Deployment Mode
###############################################################################

# The Astronomy Shop Collector runs as a Deployment rather than a DaemonSet.
#
# Why?
#
# This collector is responsible only for processing telemetry generated by the
# Astronomy Shop application.
#
# It does NOT need to run on every Kubernetes node because:
#
# • The Splunk OpenTelemetry Collector Agent already runs as a DaemonSet.
# • Infrastructure telemetry is already collected elsewhere.
# • A single application collector simplifies the lab architecture.
#
# Production Note
#
# Many production environments deploy dedicated application collectors exactly
# like this to isolate application telemetry processing from infrastructure
# collection.

opentelemetry-collector:
  mode: deployment
###############################################################################

###############################################################################
# Section 2: Replica Count
###############################################################################

# One replica is sufficient for this educational environment.
#
# Why?
#
# • The Astronomy Shop workload is intentionally small.
# • Telemetry volume is low.
# • Running a single replica minimizes resource consumption.
#
# Production Considerations
#
# Increase replicas when:
#
# • Telemetry volume becomes significant.
# • High availability is required.
# • Horizontal scaling is needed.

  replicaCount: 1
###############################################################################

###############################################################################
# Section 3: Collector Presets
###############################################################################

# The upstream OpenTelemetry Collector chart provides several presets that
# automatically configure common receivers, processors, RBAC permissions,
# volumes, and pipelines.
#
# Because Kubernetes infrastructure telemetry is already collected by the
# Splunk OpenTelemetry Collector, these presets are disabled to avoid
# duplicate data collection.

  presets:

    ###########################################################################
    # Host Metrics
    ###########################################################################

    # Disabled because node-level metrics are already collected by the
    # Splunk OpenTelemetry Collector Agent.

    hostMetrics:
      enabled: false

    ###########################################################################
    # Kubernetes Attributes
    ###########################################################################

    # Enabled so traces, metrics, and logs generated by Astronomy Shop
    # services are enriched with Kubernetes metadata including:
    #
    # • Namespace
    # • Pod
    # • Deployment
    # • Node
    # • Container
    #
    # This improves filtering and correlation inside Splunk Observability.

    kubernetesAttributes:
      enabled: true

    ###########################################################################
    # Kubelet Metrics
    ###########################################################################

    # Disabled because kubelet metrics are already collected by the
    # Splunk OpenTelemetry Collector Agent.

    kubeletMetrics:
      enabled: false

    ###########################################################################
    # Cluster Metrics
    ###########################################################################

    # Disabled because cluster-wide metrics are already collected by the
    # Splunk OpenTelemetry Collector Cluster Receiver.

    clusterMetrics:
      enabled: false

    ###########################################################################
    # Annotation Discovery
    ###########################################################################

    # Disabled because automatic annotation-based scraping is not required
    # for this lab.

    annotationDiscovery:
      metrics:
        enabled: false
###############################################################################

###############################################################################
# Section 4: OTLP Exporter
###############################################################################

# Application telemetry is forwarded to the central Splunk OpenTelemetry
# Collector running in the "splunk" namespace.
#
# Why?
#
# Using a central collector provides:
#
# • One egress point to Splunk Observability Cloud
# • Centralized processing
# • Easier configuration management
# • Consistent pipelines across all applications
#
# The Collector Agent exposes an OTLP/gRPC endpoint through its internal
# ClusterIP service.

# TLS verification is disabled because communication occurs entirely
# inside the Kubernetes cluster using the internal ClusterIP service.
#
# Production environments commonly secure internal Collector-to-Collector
# communication with mTLS or trusted certificates.

  config:

    exporters:

      otlp/splunk:
        endpoint: splunk-otel-collector-agent.splunk.svc.cluster.local:4317

        tls:
          insecure: true
###############################################################################

###############################################################################
# Section 5: Service Pipelines
###############################################################################

# The service pipelines determine how each telemetry signal (logs, metrics,
# and traces) flows through the OpenTelemetry Collector.
#
# Each pipeline consists of three primary components:
#
# • Receivers  - Accept telemetry from applications.
# • Processors - Enrich, filter, batch, or transform telemetry.
# • Exporters  - Send telemetry to one or more destinations.
#
# The Astronomy Shop Helm chart already defines the appropriate receivers
# and processors for the demo application.
#
# This lab overrides only the exporters so that telemetry continues to flow
# to the original Astronomy Shop backends while simultaneously being forwarded
# to the central Splunk OpenTelemetry Collector.
#
# Benefits of this approach:
#
# • Preserves the original Astronomy Shop user experience.
# • Enables the existing Jaeger and OpenSearch dashboards.
# • Sends the same telemetry to Splunk Observability Cloud.
# • Demonstrates how OpenTelemetry supports multiple exporters from a single
#   telemetry pipeline.
#
# Production Note
#
# Forwarding telemetry to multiple destinations is common during migrations,
# platform evaluations, or when different teams consume telemetry from
# different observability platforms.
###############################################################################
    service:
      pipelines:

        #######################################################################
        # Logs Pipeline
        #######################################################################

        # Application logs are exported to:
        #
        # • OpenSearch
        #     Preserves the Astronomy Shop log search experience.
        #
        # • Debug
        #     Writes logs to the Collector output for troubleshooting and
        #     verification during the lab.
        #
        # • OTLP/Splunk
        #     Forwards logs to the central Splunk OpenTelemetry Collector,
        #     which exports them to Splunk Observability Cloud.

        logs:
          exporters:
            - opensearch
            - debug
            - otlp/splunk

        #######################################################################
        # Metrics Pipeline
        #######################################################################

        # Application metrics are exported to:
        #
        # • OTLPHTTP/Prometheus
        #     Preserves the built-in Prometheus metrics endpoint used by the
        #     Astronomy Shop demo.
        #
        # • Debug
        #     Writes metrics to the Collector output for troubleshooting.
        #
        # • OTLP/Splunk
        #     Sends metrics to the central Splunk OpenTelemetry Collector for
        #     processing and export to Splunk Observability Cloud.

        metrics:
          exporters:
            - otlphttp/prometheus
            - debug
            - otlp/splunk

        #######################################################################
        # Traces Pipeline
        #######################################################################

        # Application traces are exported to:
        #
        # • OTLP/Jaeger
        #     Preserves distributed tracing within the Astronomy Shop demo.
        #
        # • Debug
        #     Writes spans to the Collector output for troubleshooting.
        #
        # • SpanMetrics
        #     Generates RED metrics (Request Rate, Errors, and Duration) from
        #     distributed traces for service-level monitoring.
        #
        # • OTLP/Splunk
        #     Sends traces to the central Splunk OpenTelemetry Collector for
        #     export to Splunk Observability Cloud.

        traces:
          exporters:
            - otlp/jaeger
            - debug
            - spanmetrics
            - otlp/splunk